name: Build KAIROS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/android@7
          npm install --legacy-peer-deps -D @capacitor/cli@7

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Install KAIROS native plugin
        run: bash mobile/setup-android.sh

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Keep APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: KAIROS APK #${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
